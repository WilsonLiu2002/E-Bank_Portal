spring:
  jpa:
    open-in-view: false
  kafka:
    consumer:
      group-id: transaction-service-test
    listener:
      auto-startup: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost/unused-test-jwks

exchange-rate:
  base-url: http://localhost/unused-test-rates

transactions:
  kafka:
    topic: money-account-transactions-test

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    org.springframework.kafka: WARN
