server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    location = /.well-known/jwks.json {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = /demo-tokens.json {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
}
